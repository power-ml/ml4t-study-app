<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ML4T Exam Prep — sign in</title><!--ML4T_CONFIG-->
<style>body{font:16px/1.5 -apple-system,"Segoe UI",sans-serif;max-width:420px;margin:18vh auto;padding:0 16px;text-align:center;color:#12203a}a{color:#2563eb}</style></head>
<body><h2>ML4T Exam Prep</h2><p id="m">Signing you in…</p>
<script>
// 1) still have a valid refresh token? renew silently. 2) otherwise start Cognito sign-in (authorization code + PKCE).
(async () => {
  const C = window.ML4T_HOSTED, m = document.getElementById('m');
  const raw = new URLSearchParams(location.search).get('next') || '/';
  const next = /^\/(?!\/)/.test(raw) && !raw.startsWith('/login.html') ? raw : '/';   // same-site paths only
  const setCookie = (t) => { document.cookie = 'ml4t_id=' + t.id + '; Path=/; Secure; SameSite=Strict; Max-Age=' + Math.max(60, Math.floor((t.exp - Date.now()) / 1000)); };
  try {
    const a = JSON.parse(localStorage.getItem('ml4t_auth') || 'null');
    if (a && a.refresh) {
      const r = await fetch('https://' + C.domain + '/oauth2/token', { method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: new URLSearchParams({ grant_type: 'refresh_token', client_id: C.clientId, refresh_token: a.refresh }) });
      if (r.ok) { const j = await r.json(); const t = { id: j.id_token, refresh: a.refresh, exp: Date.now() + j.expires_in * 1000 };
        localStorage.setItem('ml4t_auth', JSON.stringify(t)); setCookie(t); location.replace(next); return; }
      localStorage.removeItem('ml4t_auth');
    }
  } catch (e) { /* fall through to a fresh sign-in */ }
  const b64 = (buf) => btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  const verifier = b64(crypto.getRandomValues(new Uint8Array(32))), state = b64(crypto.getRandomValues(new Uint8Array(16)));
  sessionStorage.setItem('ml4t_pkce', JSON.stringify({ verifier, state, next }));
  const challenge = b64(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(verifier)));
  location.href = 'https://' + C.domain + '/oauth2/authorize?' + new URLSearchParams({ response_type: 'code', client_id: C.clientId,
    redirect_uri: location.origin + '/callback.html', scope: 'openid email', code_challenge_method: 'S256', code_challenge: challenge, state });
})().catch(() => { document.getElementById('m').innerHTML = 'Could not start sign-in. <a href="/login.html">Try again</a>'; });
</script></body></html>
